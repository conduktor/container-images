name: "Setup Chainguard tool"
description: >
  Install a Chainguard Go CLI (apko, melange, ...) on a linux/amd64 runner.
  Resolves the requested version (or the latest release) to an immutable
  release tag + commit sha1, verifies the downloaded archive against the
  release SHA-256 checksums and their Sigstore (cosign keyless) signature,
  then verifies the installed binary reports the expected tag and commit.

# Started life as the public-repo port of conduktor/conduktor-actions/setup-apko
# — there is no `chainguard-dev/actions/setup-apko` upstream (that path 404s), so
# we ship our own hardened installer rather than `apt` or `curl | sh`.
#
# Generalised to any Chainguard CLI once melange was needed too. Their releases
# are goreleaser-built to the same shape — `<tool>_<version>_linux_amd64.tar.gz`
# beside a cosign-signed `checksums.txt`, and a `version` subcommand printing
# `GitVersion:` / `GitCommit:` — so only the tool name varies. The alternative,
# `chainguard-dev/actions/setup-melange`, installs Go and build-essential and
# builds from source; this downloads one verified binary.
#
# See the accompanying README for the trust model.

inputs:
  tool:
    required: false
    default: "apko"
    description: >
      (string) Chainguard CLI to install. Doubles as the binary name, the
      release archive prefix, and by default the repository name under
      chainguard-dev.
  version:
    required: false
    default: "latest"
    description: (string) Version to install, e.g. 1.2.30 or v1.2.30. Use "latest" to resolve the latest GitHub release.
  repository:
    required: false
    default: ""
    description: (string) GitHub repository to download releases from. Defaults to chainguard-dev/<tool>.
  github-token:
    required: false
    default: ${{ github.token }}
    description: (string) Token used by the GitHub CLI to resolve and download the release.
  expected-commit-sha:
    required: false
    default: ""
    description: (string) If set, fail unless the resolved release tag points at this commit sha1 (full or abbreviated).
  expected-sha256:
    required: false
    default: ""
    description: (string) If set, fail unless the downloaded archive matches this SHA-256 checksum.
  verify-signature:
    required: false
    default: "true"
    description: (bool) Verify the Sigstore (cosign keyless) signature of the release checksums.txt.
  cosign-certificate-identity-regexp:
    required: false
    default: ""
    description: >
      (string) Expected cosign certificate identity (regexp) of the release
      signing workflow. Defaults to the tool's own workflows under
      chainguard-dev/<tool>.
  cosign-oidc-issuer:
    required: false
    default: "https://token.actions.githubusercontent.com"
    description: (string) Expected cosign certificate OIDC issuer.
  install-dir:
    required: false
    default: ""
    description: (string) Directory to install the binary into (defaults to a versioned directory in the runner tool cache).

outputs:
  version:
    description: Installed version without the leading v, e.g. 1.2.30.
    value: ${{ steps.resolve.outputs.version }}
  tag:
    description: Release tag the installation is pinned to, e.g. v1.2.30.
    value: ${{ steps.resolve.outputs.tag }}
  commit-sha:
    description: Commit sha1 the release tag points at, also verified against the installed binary.
    value: ${{ steps.resolve.outputs.commit-sha }}
  sha256:
    description: SHA-256 checksum of the downloaded release archive.
    value: ${{ steps.install.outputs.sha256 }}
  path:
    description: Full path to the installed binary.
    value: ${{ steps.install.outputs.path }}
  install-dir:
    description: Directory added to PATH that contains the binary.
    value: ${{ steps.resolve.outputs.install-dir }}

runs:
  using: composite
  steps:
    - name: Resolve release tag and commit sha1
      id: resolve
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TOOL: ${{ inputs.tool }}
        REPOSITORY: ${{ inputs.repository || format('chainguard-dev/{0}', inputs.tool) }}
        VERSION: ${{ inputs.version }}
        EXPECTED_COMMIT_SHA: ${{ inputs.expected-commit-sha }}
        INSTALL_DIR_INPUT: ${{ inputs.install-dir }}
      run: "${{ github.action_path }}/scripts/resolve-release.sh"

    - name: Install cosign
      if: inputs.verify-signature == 'true'
      # v3 installer cannot install cosign v3.x — must use v4+.
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Download and verify the release archive
      id: install
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TOOL: ${{ inputs.tool }}
        REPOSITORY: ${{ inputs.repository || format('chainguard-dev/{0}', inputs.tool) }}
        TAG: ${{ steps.resolve.outputs.tag }}
        ARCHIVE: ${{ steps.resolve.outputs.archive }}
        INSTALL_DIR: ${{ steps.resolve.outputs.install-dir }}
        EXPECTED_SHA256: ${{ inputs.expected-sha256 }}
        VERIFY_SIGNATURE: ${{ inputs.verify-signature }}
        CERTIFICATE_IDENTITY_REGEXP: >-
          ${{ inputs.cosign-certificate-identity-regexp ||
              format('^https://github\.com/chainguard-dev/{0}/\.github/workflows/.+$', inputs.tool) }}
        OIDC_ISSUER: ${{ inputs.cosign-oidc-issuer }}
      run: "${{ github.action_path }}/scripts/download-and-verify.sh"

    - name: Verify the installed binary
      shell: bash
      env:
        TOOL: ${{ inputs.tool }}
        EXPECTED_PATH: ${{ steps.install.outputs.path }}
        EXPECTED_TAG: ${{ steps.resolve.outputs.tag }}
        EXPECTED_COMMIT_SHA: ${{ steps.resolve.outputs.commit-sha }}
      run: "${{ github.action_path }}/scripts/verify-binary.sh"
