name: pr

# On every PR that touches an image config or the build/CI plumbing, build each
# affected image and scan it with Trivy + Grype. Scanning is report-only: the
# counts land in the job summary and in one sticky PR comment. See AGENTS.md
# rule 11 for why there is no CVE gate yet.
#
# The build is build.yml — the same workflow the nightly calls, with
# `publish: false`. So a PR exercises the real assembly path (per-arch APK jobs,
# artifact merge, index re-signing) rather than a simplified stand-in.
on:
  pull_request:
    paths:
      - "images/**"
      - "build.sh"
      - "scripts/**"
      - "Makefile"
      # Whole tree, not just workflows/: the CI-only scripts and the composite
      # actions live here too, and they must not be able to change untested.
      - ".github/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write # the `report` job upserts the sticky CVE comment

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Unconditional: these scripts feed both workflows, and a broken images.json
  # would otherwise only surface mid-nightly.
  #
  # Runs pre-commit rather than `make lint-shell` so every linter is pinned by
  # .pre-commit-config.yaml. The runner's own shellcheck is older than the pinned
  # one and disagrees with it, which let an SC2015 through locally and failed CI.
  lint:
    name: pre-commit + script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache pre-commit hooks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        env:
          # The only hook needing a system binary; the build job runs
          # `apko show-config` anyway.
          SKIP: apko-show-config
        run: |
          pipx install pre-commit
          pre-commit run --all-files --show-diff-on-failure

      - name: Script unit tests
        run: make test

  detect-changes:
    name: detect changed images
    runs-on: ubuntu-latest
    outputs:
      # Comma-separated subset for build.yml; empty means "every image".
      subset: ${{ steps.changed.outputs.subset }}
      any: ${{ steps.changed.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Map changed files to image dirs
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Only the changed-file -> image-dir mapping lives here; resolving that
          # into a matrix is build.yml's job, via scripts/build-matrix.sh.
          #
          # A change to build.sh, scripts/, workflows or the inventory itself is
          # cross-cutting and rebuilds everything (empty subset = all).
          set -euo pipefail
          emit() { # emit(subset, any)
            { echo "subset=$1"; echo "any=$2"; } >> "$GITHUB_OUTPUT"
            echo "subset='$1' any=$2"
          }
          if [ -z "${BASE_SHA:-}" ] || [ -z "${HEAD_SHA:-}" ]; then
            emit "" true
            exit 0
          fi
          changed_files=$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")
          if echo "${changed_files}" \
            | grep -Eq '^(build\.sh|scripts/|\.github/|images/images\.json$)'; then
            emit "" true
            exit 0
          fi
          set +e
          # `[^/]+/` so top-level files under images/ aren't read as image dirs.
          dirs=$(echo "${changed_files}" | awk -F/ '/^images\/[^/]+\// {print $2}' | sort -u)
          set -e
          if [ -z "${dirs}" ]; then
            emit "" false
          else
            emit "$(printf '%s' "${dirs}" | paste -sd, -)" true
          fi

  # Same workflow the nightly runs, minus the push. x86_64 only: a PR proves the
  # shape and the amd64 build, and the nightly is what proves aarch64 — building
  # both here would double the wall clock of every image-touching PR.
  build:
    name: build
    needs: detect-changes
    if: needs.detect-changes.outputs.any == 'true'
    uses: ./.github/workflows/build.yml
    with:
      images: ${{ needs.detect-changes.outputs.subset }}
      arches: x86_64
      publish: false

  # After the build, so the PR gets one comment instead of one per image.
  report:
    name: comment CVE report
    needs: build
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Not merge-multiple: every artifact has trivy.json / grype.json, so
      # merging would overwrite.
      - name: Download scan reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: scans-*
          path: scans/
        continue-on-error: true # no artifacts when every image was skipped

      - name: Render report
        run: ./.github/scripts/scan-report.sh scans/ > report.md

      # Fork PRs get a read-only token; the job summary carries the same table.
      - name: Post sticky comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: ./.github/actions/pr-comment
        with:
          marker: cve-report
          body-file: report.md

      - name: Note when commenting is skipped
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::notice::Fork PR — CVE report is in the job summary, not a comment."
          cat report.md >> "$GITHUB_STEP_SUMMARY"
