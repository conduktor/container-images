name: pr

# On every PR that touches an image config or the build/CI plumbing, build each
# affected image locally with apko (no push, no signing) and scan it with Trivy +
# Grype. Scanning is report-only: the counts land in the job summary and in one
# sticky PR comment. See AGENTS.md rule 11 for why there is no CVE gate yet.
on:
  pull_request:
    paths:
      - "images/**"
      - "build.sh"
      - "scripts/**"
      - "Makefile"
      # Whole tree, not just workflows/: the CI-only scripts and the composite
      # actions live here too, and they must not be able to change untested.
      - ".github/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write # the `report` job upserts the sticky CVE comment

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  APKO_VERSION: v1.2.30
  # Keep in sync with the nightly and with flake.nix.
  MELANGE_VERSION: v0.41.1

jobs:
  # Unconditional: these scripts feed both workflows, and a broken images.json
  # would otherwise only surface mid-nightly.
  #
  # Runs pre-commit rather than `make lint-shell` so every linter is pinned by
  # .pre-commit-config.yaml. The runner's own shellcheck is older than the pinned
  # one and disagrees with it, which let an SC2015 through locally and failed CI.
  lint:
    name: pre-commit + script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache pre-commit hooks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        env:
          # The only hook needing a system binary; the build job runs
          # `apko show-config` anyway.
          SKIP: apko-show-config
        run: |
          pipx install pre-commit
          pre-commit run --all-files --show-diff-on-failure

      - name: Script unit tests
        run: make test

  detect-changes:
    name: detect changed images
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute changed image matrix
        id: build
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # A change to build.sh, scripts/, workflows or the inventory itself is
          # cross-cutting and rebuilds everything.
          #
          # Only the changed-file -> image-dir mapping lives here; the matrix
          # entries themselves (melange flag + config list) come from
          # scripts/build-matrix.sh so this and the nightly agree.
          set -euo pipefail
          emit() { # emit(subset) — "" means every image
            matrix="$(./scripts/build-matrix.sh "$1" | jq -c '.images')"
            echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
            jq -rj '"building: " + ([.[].dir] | join(", ")) + "\n"' <<<"${matrix}"
          }
          if [ -z "${BASE_SHA:-}" ] || [ -z "${HEAD_SHA:-}" ]; then
            emit ""
            exit 0
          fi
          changed_files=$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")
          if echo "${changed_files}" \
            | grep -Eq '^(build\.sh|scripts/|\.github/|images/images\.json$)'; then
            emit ""
            exit 0
          fi
          set +e
          # `[^/]+/` so top-level files under images/ aren't read as image dirs.
          dirs=$(echo "${changed_files}" | awk -F/ '/^images\/[^/]+\// {print $2}' | sort -u)
          set -e
          if [ -z "${dirs}" ]; then
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
          else
            emit "$(printf '%s' "${dirs}" | paste -sd, -)"
          fi

  build-and-scan:
    name: build+scan ${{ matrix.image.dir }}
    needs: detect-changes
    if: needs.detect-changes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install apko
        uses: ./.github/actions/setup-apko
        with:
          version: ${{ env.APKO_VERSION }}

      # Keyed on the pinned source hashes; restore-keys lets a single bumped
      # source reuse the cache for the others.
      - name: Resolve melange source cache key
        id: srcs
        if: matrix.image.melange
        env:
          DIR: ${{ matrix.image.dir }}
        run: |
          set -euo pipefail
          sources="$(./scripts/melange-sources.sh "${DIR}")"
          printf '%s\n' "${sources}"
          echo "key=$(printf '%s' "${sources}" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache melange sources
        if: matrix.image.melange
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/melange-cache
          key: melange-src-${{ matrix.image.dir }}-x86_64-${{ steps.srcs.outputs.key }}
          restore-keys: melange-src-${{ matrix.image.dir }}-x86_64-

      - name: Prefetch melange sources
        if: matrix.image.melange
        env:
          DIR: ${{ matrix.image.dir }}
        run: ./scripts/melange-sources.sh "${DIR}" --prefetch "${{ runner.temp }}/melange-cache"

      # Same melange step as the nightly's apks job, so a PR that only touches
      # images/debug/tools/ or a melange recipe is proven to package and install
      # before merge. Single-arch, so it stays one job: x86_64 only here, native,
      # matching the amd64-only apko build below. The nightly is what proves
      # aarch64 — on its own native runner.
      - name: Build local APKs with melange
        if: matrix.image.melange
        uses: chainguard-dev/actions/melange-build@9d631658f55713e5f63ca0cc21ee168f81301fd9 # v1.6.30
        with:
          version: ${{ env.MELANGE_VERSION }}
          multi-config: ${{ matrix.image.configs }}
          workdir: images/${{ matrix.image.dir }}
          archs: x86_64
          sign-with-temporary-key: true
          # Trivy skips packages whose PURL namespace doesn't match the image's
          # distro, so without this our own packages' CVEs go unreported.
          namespace: wolfi
          cache-dir: ${{ runner.temp }}/melange-cache
          signing-key-path: ${{ github.workspace }}/images/${{ matrix.image.dir }}/melange.rsa
          repository-path: ${{ github.workspace }}/images/${{ matrix.image.dir }}/packages

      - name: Validate apko.yaml parses
        working-directory: images/${{ matrix.image.dir }}
        # apko has no dedicated `lint` subcommand; show-config parses + normalizes
        # the YAML and fails on invalid schema/refs, which is functionally a lint.
        run: apko show-config apko.yaml > /dev/null

      - name: Build image tar (amd64) with SBOM
        working-directory: images/${{ matrix.image.dir }}
        run: |
          apko build \
            --arch amd64 \
            --sbom-path . \
            apko.yaml \
            "pr-${{ github.event.pull_request.number || 'manual' }}/${{ matrix.image.dir }}:${{ github.sha }}" \
            image.tar

      - name: Load into Docker (for scanners that want a daemon ref)
        id: load
        working-directory: images/${{ matrix.image.dir }}
        run: |
          out=$(docker load -i image.tar)
          echo "${out}"
          ref=$(echo "${out}" | sed -n 's/^Loaded image: //p' | head -n1)
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      # Report-only; see AGENTS.md rule 11. Flip fail-on once the baseline is
      # trusted.
      - name: Scan for CVEs
        uses: ./.github/actions/scan-image
        with:
          image: ${{ steps.load.outputs.ref }}
          tar: images/${{ matrix.image.dir }}/image.tar
          label: ${{ matrix.image.dir }}
          fail-on: none

      - name: Upload scan reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scans-${{ matrix.image.dir }}
          path: |
            trivy.json
            grype.json
          retention-days: 7

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-${{ matrix.image.dir }}
          path: |
            images/${{ matrix.image.dir }}/image.tar
            images/${{ matrix.image.dir }}/*.spdx.json
          retention-days: 7

  # After the matrix, so the PR gets one comment instead of one per image.
  report:
    name: comment CVE report
    needs: build-and-scan
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Not merge-multiple: every artifact has trivy.json / grype.json, so
      # merging would overwrite.
      - name: Download scan reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: scans-*
          path: scans/
        continue-on-error: true # no artifacts when every image was skipped

      - name: Render report
        run: ./.github/scripts/scan-report.sh scans/ > report.md

      # Fork PRs get a read-only token; the job summary carries the same table.
      - name: Post sticky comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: ./.github/actions/pr-comment
        with:
          marker: cve-report
          body-file: report.md

      - name: Note when commenting is skipped
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::notice::Fork PR — CVE report is in the job summary, not a comment."
          cat report.md >> "$GITHUB_STEP_SUMMARY"
