name: nightly

# Nightly rebuild of every image so Wolfi package updates land within 24h of
# upstream — which only holds while every run resolves against the live Wolfi
# index, so nothing here may cache apks or pin versions: publish multi-arch,
# sign + attest (SBOM and SLSA provenance), scan, then push refreshed CVE badge
# JSON to the `badges` branch.
#
# The build itself lives in build.yml, which pr.yml calls too — the only
# difference here is `publish: true`. Do not fork a nightly-only copy of those
# steps; that asymmetry is what let the PR check pass while the nightly's
# assembly path went untested.
on:
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC daily
  workflow_dispatch:
    inputs:
      images:
        description: "Comma-separated subset to build (default: all). Values must match images/images.json"
        required: false
        default: ""

permissions:
  contents: read
  packages: write # push to GHCR
  id-token: write # cosign keyless OIDC + SLSA provenance
  attestations: write # actions/attest-build-provenance

concurrency:
  group: nightly-publish
  cancel-in-progress: false

jobs:
  build:
    name: build
    uses: ./.github/workflows/build.yml
    with:
      images: ${{ github.event.inputs.images || '' }}
      arches: x86_64,aarch64
      publish: true
    secrets:
      CONDUKTORBOT_DOCKER_HUB_USERNAME: ${{ secrets.CONDUKTORBOT_DOCKER_HUB_USERNAME }}
      CONDUKTORBOT_DOCKER_HUB_PAT: ${{ secrets.CONDUKTORBOT_DOCKER_HUB_PAT }}

  publish-badges:
    name: refresh CVE badges
    runs-on: ubuntu-latest
    needs: build
    if: ${{ !cancelled() && needs.build.result != 'skipped' && needs.build.outputs.count != '0' }}
    permissions:
      contents: write # push refreshed JSON to the `badges` branch
    steps:
      # Only needed for the publish-badges.sh script itself — the workflow
      # never touches main. The script clones the `badges` branch into a
      # temp dir of its own (or creates it orphan on first run).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all badge artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: badges-*
          path: badges-out/
          merge-multiple: true

      # main is protected, so we publish to a dedicated orphan `badges` branch
      # and point the README's shields.io URLs at that branch instead. It is
      # state-only: publish-badges.sh overwrites every file on each run.
      - name: Publish badges to `badges` branch
        env:
          REMOTE_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: ./.github/scripts/publish-badges.sh badges-out badges
