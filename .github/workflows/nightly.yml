name: nightly

# Nightly rebuild of every image so Wolfi package updates land within 24h of
# upstream: publish multi-arch, sign + attest (SBOM and SLSA provenance), scan,
# then commit refreshed CVE badge JSON back to main.
#
# The image inventory comes from images/images.json, not from this file.
#
# Every third-party action is pinned to a full commit SHA with the tag in a
# trailing comment; Dependabot bumps them weekly.
on:
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC daily
  workflow_dispatch:
    inputs:
      images:
        description: "Comma-separated subset to build (default: all). Values must match images/images.json"
        required: false
        default: ""

permissions:
  contents: read
  packages: write # push to GHCR
  id-token: write # cosign keyless OIDC + SLSA provenance
  attestations: write # actions/attest-build-provenance

concurrency:
  group: nightly-publish
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  REGISTRY_NAMESPACE: ${{ github.repository_owner }}
  APKO_VERSION: v1.2.30
  # cosign version is pinned by the sigstore/cosign-installer SHA below.
  # The v4 installer explicitly discourages `cosign-release` overrides.

jobs:
  prepare:
    name: resolve image matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Filtering here rather than per-step in `publish` means a skipped image
      # produces no job at all.
      - name: Resolve matrix from images/images.json
        id: matrix
        env:
          SUBSET: ${{ github.event.inputs.images }}
        run: |
          set -euo pipefail
          matrix="$(./scripts/image-matrix.sh "${SUBSET}")"
          {
            echo "matrix=${matrix}"
            echo "count=$(jq 'length' <<<"${matrix}")"
          } >> "$GITHUB_OUTPUT"
          jq -rj '"building: " + ([.[].dir] | join(", ")) + "\n"' <<<"${matrix}"

  publish:
    name: publish-${{ matrix.image.dir }}
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute tags
        id: tags
        env:
          IMAGE_NAME: ${{ matrix.image.name }}
          # Empty for GHCR-only images; unquoted expansion below drops it.
          DOCKERHUB_REPO: ${{ matrix.image.dockerhub }}
        run: |
          set -euo pipefail
          GHCR_REPO="${REGISTRY}/${REGISTRY_NAMESPACE}/${IMAGE_NAME}"
          # Kept orthogonal: consumers below build the cross-product they need.
          {
            echo "ref=${GHCR_REPO}"
            echo "repos=${GHCR_REPO}${DOCKERHUB_REPO:+ ${DOCKERHUB_REPO}}"
            echo "tags=latest nightly $(date -u +%Y.%m.%d) git-$(git rev-parse --short HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Install apko
        uses: ./.github/actions/setup-apko
        with:
          version: ${{ env.APKO_VERSION }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Globbed rather than listed so adding a melange*.yaml needs no CI change.
      - name: Collect melange configs
        id: melange
        env:
          DIR: ${{ matrix.image.dir }}
        run: |
          set -euo pipefail
          configs="$(cd "images/${DIR}" \
            && find . -maxdepth 1 -name 'melange*.yaml' -printf '%f\n' \
            | sort | paste -sd, -)"
          echo "configs=${configs}" >> "$GITHUB_OUTPUT"
          echo "melange configs: ${configs:-<none>}"

      # The temporary signing key only has to satisfy apk's index signature check
      # inside this job, so it is generated per run and never stored.
      # setup-melange installs qemu-user-static itself, so the aarch64 packages
      # cross-build without a separate QEMU step.
      - name: Build local APKs with melange
        if: steps.melange.outputs.configs != ''
        uses: chainguard-dev/actions/melange-build@9d631658f55713e5f63ca0cc21ee168f81301fd9 # v1.6.30
        with:
          multi-config: ${{ steps.melange.outputs.configs }}
          workdir: images/${{ matrix.image.dir }}
          archs: x86_64,aarch64
          sign-with-temporary-key: true
          # Absolute paths so they land where apko.yaml's `@local ./packages`
          # and `./melange.rsa.pub` resolve from the image directory.
          signing-key-path: ${{ github.workspace }}/images/${{ matrix.image.dir }}/melange.rsa
          repository-path: ${{ github.workspace }}/images/${{ matrix.image.dir }}/packages

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Org access token scoped to write on this one Docker Hub repository — the
      # only registry credential in this public repo. Never widen it; private
      # registries pull from GHCR rather than being pushed to. See AGENTS.md rule 8.
      - name: Login to Docker Hub
        if: matrix.image.dockerhub != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.CONDUKTORBOT_DOCKER_HUB_USERNAME }}
          password: ${{ secrets.CONDUKTORBOT_DOCKER_HUB_PAT }}

      - name: Publish with apko (multi-arch, SBOM per arch + index)
        id: apko
        working-directory: images/${{ matrix.image.dir }}
        env:
          REPOS: ${{ steps.tags.outputs.repos }}
          TAGS: ${{ steps.tags.outputs.tags }}
          GHCR_REPO: ${{ steps.tags.outputs.ref }}
        run: |
          set -euo pipefail
          # repos × tags into "$@" so the refs stay properly quoted.
          set --
          for repo in ${REPOS}; do
            for tag in ${TAGS}; do
              set -- "$@" "${repo}:${tag}"
            done
          done

          # apko prints one `<ref>@sha256:...` line per pushed tag, all resolving
          # to the same OCI index digest — across registries too, since the
          # content is byte-identical. Take the last line.
          out=$(apko publish \
            --arch amd64,arm64 \
            --sbom-path . \
            apko.yaml \
            "$@")
          echo "${out}"
          last=$(printf '%s\n' "${out}" | tail -n1)
          digest="${last##*@}"

          images=""
          for repo in ${REPOS}; do
            images="${images}${images:+ }${repo}@${digest}"
          done

          {
            echo "digest=${digest}"
            echo "image=${GHCR_REPO}@${digest}"
            echo "images=${images}"
          } >> "$GITHUB_OUTPUT"

      # Signed per registry rather than copied from GHCR: a native signature
      # embeds the registry's own ref, so the README `cosign verify` snippet is
      # identical for docker.io and ghcr.io pulls.
      - name: Sign image (cosign keyless)
        env:
          COSIGN_YES: "true"
          IMAGES: ${{ steps.apko.outputs.images }}
        run: |
          set -euo pipefail
          for image in ${IMAGES}; do
            cosign sign "${image}"
          done

      - name: Attest apko-emitted SPDX SBOMs
        env:
          COSIGN_YES: "true"
          IMAGES: ${{ steps.apko.outputs.images }}
          IMAGE_DIR: ${{ matrix.image.dir }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for image in ${IMAGES}; do
            for f in "images/${IMAGE_DIR}"/*.spdx.json; do
              cosign attest --predicate "${f}" --type spdxjson "${image}"
            done
          done

      - name: Generate SLSA build-provenance attestation
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ steps.tags.outputs.ref }}
          subject-digest: ${{ steps.apko.outputs.digest }}
          push-to-registry: true

      # The action takes a single subject-name, so the mirror needs its own step.
      - name: Generate SLSA build-provenance attestation (Docker Hub)
        if: matrix.image.dockerhub != ''
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ matrix.image.dockerhub }}
          subject-digest: ${{ steps.apko.outputs.digest }}
          push-to-registry: true

      - name: Scan for CVEs
        uses: ./.github/actions/scan-image
        with:
          image: ${{ steps.apko.outputs.image }}
          label: ${{ matrix.image.name }}
          fail-on: none # the nightly reports; it must never block a rebuild

      - name: Upload scan artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scans-${{ matrix.image.dir }}
          path: |
            trivy.json
            grype.json
            images/${{ matrix.image.dir }}/*.spdx.json
          retention-days: 30

      - name: Build CVE badge JSON
        env:
          IMAGE_NAME: ${{ matrix.image.name }}
        run: ./.github/scripts/cve-badge.sh trivy.json grype.json "${IMAGE_NAME}" badges

      - name: Upload badge JSON
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: badges-${{ matrix.image.dir }}
          path: badges/
          retention-days: 30

  publish-badges:
    name: refresh README badges
    runs-on: ubuntu-latest
    needs: [prepare, publish]
    if: ${{ !cancelled() && needs.prepare.outputs.count != '0' }}
    permissions:
      contents: write # commit refreshed badge JSON back to main
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
          persist-credentials: true

      - name: Download all badge artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: badges-*
          path: badges-raw/
          merge-multiple: true

      - name: Copy into .github/badges/
        run: |
          mkdir -p .github/badges
          find badges-raw -maxdepth 1 -type f -name '*.json' -exec cp {} .github/badges/ \;

      - name: Commit + push if changed
        env:
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
        run: |
          # Stage first: plain `git diff` ignores untracked files, which would
          # silently no-op the very first badge publish.
          git add .github/badges/
          if git diff --cached --quiet -- .github/badges/; then
            echo "No badge changes — nothing to commit."
            exit 0
          fi
          git commit -m "ci: refresh CVE badges [skip ci]"
          git push
