version: 2
updates:
  # Bump third-party GitHub Actions SHAs weekly. Dependabot rewrites both the
  # SHA in `uses:` and the trailing `# vX.Y.Z` comment.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"
      include: scope

  # Bump the dev container feature pins. They are dev-only (nothing here ships
  # in an image), but the pins are majors and would otherwise never move.
  - package-ecosystem: devcontainers
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: "chore"
      include: scope
