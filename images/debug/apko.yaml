# conduktor/conduktor-debug
#
# Public debug sidecar image for Conduktor Console and Gateway. Deploy
# alongside a running JVM pod (same PID/network namespace) to inspect
# network, TLS, LDAP, Kafka and JVM state without shelling into the
# production container or installing tooling on the host.
#
# Typical Helm sidecar usage:
#   - shareProcessNamespace: true       # so jcmd/jstack can see the target JVM
#   - runAsUser: 10001 or 1001          # match the target JVM's UID
#
# The JVM attach mechanism (jcmd, jstack, jmap, jinfo, jfr) checks the peer's
# credentials: HotSpot accepts the attach when the caller is root OR its
# effective uid+gid exactly match the target JVM's. Running the sidecar as
# 10001 — the same `conduktor` UID/GID the base images ship, so the same UID
# the product container runs as — satisfies that without root, and without
# SYS_PTRACE, which the attach path does not use at all.
#
# SYS_PTRACE is only needed for the tools that really do ptrace(2): strace,
# and the Serviceability Agent paths (`jstack -F`, `jmap -F`, `jhsdb`).
# tcpdump needs NET_RAW. Add either capability only when you need those tools.
#
# We ship the full OpenJDK 25 JDK (jstack/jmap/jcmd/jhsdb/jfr) rather than
# the JRE + `jattach`, because Wolfi does not currently package jattach.
# The debug image is size-tolerant (it's a sidecar, not a hot path), so
# the ~150MB delta over the JRE is acceptable.
contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Local APK built by melange.yaml from tools/. Both this and the key below
    # are produced by `make debug-scripts`; `apko show-config` does not resolve
    # repositories, so lint still passes on a fresh clone.
    - "@local ./packages"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  packages:
    # --- Conduktor tooling built locally by melange (see melange*.yaml) ---
    - conduktor-debug-scripts@local # cdk-* support scripts from tools/
    - conduktor-ctl@local # `conduktor` CLI, from conduktor/ctl releases
    - kafka-tools@local # kafka-topics.sh & friends; reuses this image's JDK 25

    # --- OS baseline (same as base-jre-25) ---
    - wolfi-baselayout
    - glibc
    - ca-certificates-bundle
    - tzdata
    - busybox
    - bash
    - coreutils
    - sed
    - gawk
    - findutils
    - grep
    - procps # ps, top, pgrep, pkill, uptime, free
    - sysstat # iostat, pidstat, mpstat (per-process I/O — iotop isn't in Wolfi)

    # --- JVM diagnostics ---
    - openjdk-25 # full JDK: jstack, jmap, jcmd, jhsdb, jfr, keytool
    - java-cacerts
    - async-profiler # low-overhead CPU/alloc/lock/wall-clock profiler

    # --- Network debugging ---
    - iproute2 # ip, ss, tc
    - iputils # ping, tracepath
    - bind-tools # dig, nslookup, host
    - tcpdump
    - nmap # nmap
    - netcat-openbsd # nc (Wolfi ships the OpenBSD flavour, not nmap-ncat)
    - socat
    - mtr
    - iftop # interface bandwidth
    - htop
    - lsof
    - strace

    # --- TLS / SSL debugging ---
    - openssl # s_client, x509, verify, ...
    - libnss-tools # certutil / pk12util (NSS PKI tooling)

    # --- LDAP debugging ---
    - openldap-2.6-clients # ldapsearch / ldapwhoami (a.k.a. ldap-utils)

    # --- Kafka debugging ---
    - kafkacat # produce/consume/metadata CLI; installs the `kcat` binary

    # --- Console's PostgreSQL database ---
    - postgresql-17-client # psql, pg_dump, pg_isready
    - py3-pgcli # pgcli: psql with autocomplete + syntax highlighting

    # --- Kubernetes API access ---
    - kubectl-latest

    # --- HTTP + JSON/YAML ergonomics ---
    - curl
    - wget
    - jq
    - yq

    # --- Editor for on-the-fly config tweaks ---
    - vim

accounts:
  groups:
    - groupname: conduktor
      gid: 10001
    - groupname: gateway # Legacy group for Conduktor Gateway
      gid: 1001
  users:
    - username: conduktor
      uid: 10001
      gid: 10001
    - username: gateway # Legacy user for Conduktor Gateway
      uid: 1001
      gid: 1001

environment:
  JAVA_HOME: /usr/lib/jvm/java-25-openjdk
  # /usr/local/bin holds the cdk-* support scripts, and also iputils' arping /
  # tracepath / clockdiff — all unreachable before it was added here.
  # /usr/lib/kafka/bin must be on PATH rather than symlinked into /usr/bin: the
  # Kafka scripts locate kafka-run-class and share/java/kafka relative to $0.
  PATH: /usr/lib/jvm/java-25-openjdk/bin:/usr/local/sbin:/usr/local/bin:/usr/lib/kafka/bin:/usr/sbin:/sbin:/usr/bin:/bin
  LANG: C.UTF-8
  TZ: UTC

# No `run-as`: the image defaults to root so tcpdump/strace also work without
# extra capabilities. Prefer overriding with `runAsUser: 10001` at deploy time
# when you only need the JVM tooling — see the attach-credentials note above.
cmd: /bin/bash

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.title: "Conduktor debug sidecar (Wolfi/apko)"
  org.opencontainers.image.description: "Network / TLS / LDAP / Kafka / JVM debugging toolkit as a sidecar image for Conduktor products."
  org.opencontainers.image.vendor: "Conduktor"
  org.opencontainers.image.authors: "Conduktor <support@conduktor.io>"
  org.opencontainers.image.source: "https://github.com/conduktor/container-images"
  org.opencontainers.image.licenses: "Apache-2.0"
