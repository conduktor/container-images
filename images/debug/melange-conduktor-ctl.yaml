# Packages the Conduktor CLI (https://github.com/conduktor/ctl) as an APK so the
# debug sidecar can drive Console's API from inside the cluster.
#
# Repackages the released static binary rather than building from source: melange
# builds each arch in a sandbox of that arch, so a Go build would compile under
# qemu emulation for aarch64 every nightly. Upstream publishes only MD5, so we
# pin our own SHA-256.
#
# BUMPING: change `version`, then replace BOTH sha256 values:
#   v=0.9.0
#   for a in amd64 arm64; do
#     curl -sSL "https://github.com/conduktor/ctl/releases/download/v${v}/conduktor-v${v}-linux-${a}.tar.gz" \
#       | sha256sum | cut -d' ' -f1
#   done
package:
  name: conduktor-ctl
  version: 0.9.2
  epoch: 0
  description: Conduktor CLI (conduktor/ctl) — apply/get/token/sql against Console
  copyright:
    - license: Apache-2.0

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox

pipeline:
  # See melange-kafka-tools.yaml for why dot:giga.
  - name: Quiet wget progress output
    runs: printf 'progress = dot:giga\n' >> /etc/wgetrc

  # strip-components: 0 — the tarball holds a bare binary, no top-level dir.
  - if: ${{build.arch}} == 'x86_64'
    uses: fetch
    with:
      uri: https://github.com/conduktor/ctl/releases/download/v${{package.version}}/conduktor-v${{package.version}}-linux-amd64.tar.gz
      expected-sha256: c2cda3749c616b564af3813eadebfe310505e252657b30b07a488494d536ff02
      strip-components: 0

  - if: ${{build.arch}} == 'aarch64'
    uses: fetch
    with:
      uri: https://github.com/conduktor/ctl/releases/download/v${{package.version}}/conduktor-v${{package.version}}-linux-arm64.tar.gz
      expected-sha256: f3274d251961ec34bd1acc77c243eec34de0ada4ae827f73fbdf44d33cbb84e4
      strip-components: 0

  - name: Install the conduktor binary
    runs: |
      install -d "${{targets.destdir}}/usr/bin"
      install -m 0755 conduktor "${{targets.destdir}}/usr/bin/conduktor"

  - name: Smoke-test the packaged binary
    runs: |
      # Fails the build if the artifact is not the expected release.
      out="$("${{targets.destdir}}/usr/bin/conduktor" version)"
      echo "${out}"
      echo "${out}" | grep -q "v${{package.version}}" \
        || { echo "binary does not report v${{package.version}}"; exit 1; }
